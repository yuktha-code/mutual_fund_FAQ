name: Offline parsing and data-lineage checks
on:
  push:
  pull_request:
jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules
        run: python -m compileall -q scripts/phase1 scripts/phase2 scripts/phase3 scripts/phase4 scripts/audit_saved_results.py
      - name: Run offline quality tests
        run: python -m unittest discover -s tests -v
      - name: Audit prior saved evaluation reports
        run: python scripts/audit_saved_results.py
